<svg xmlns="http://www.w3.org/2000/svg" width="980" height="250" viewBox="0 0 980 250" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><defs><pattern id="d" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="1" fill="#353841" opacity="1"/></pattern><pattern id="h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#eebd53" stroke-width="1.5" opacity=".6"/></pattern></defs><rect width="980" height="250" fill="#17181c"/><rect width="980" height="250" fill="url(#d)"/><rect x="40" y="116" width="600" height="44" rx="6" fill="#17264f" stroke="#3369ff" stroke-width="1.2"/><text x="340.0" y="143" font-size="13" font-weight="600" fill="#edeef3" text-anchor="middle">Training part: the model learns here</text><rect x="640" y="116" width="300" height="44" rx="6" fill="#4e4022" stroke="#eebd53" stroke-width="1.2"/><rect x="640" y="116" width="300" height="44" rx="6" fill="url(#h)" stroke="#eebd53" stroke-width="1.2"/><text x="790.0" y="143" font-size="13" font-weight="600" fill="#f9e8c3" text-anchor="middle">Held back: one horizon</text><polyline points="40,184 940,184" fill="none" stroke="#888c96" stroke-width="1.2" stroke-linejoin="round"/><polyline points="933.0,187.8 940,184 933.0,180.2" fill="none" stroke="#888c96" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="940" y="206" font-size="12" font-weight="500" fill="#a3a7b1" text-anchor="end" font-style="italic">training period</text><text x="40" y="62" font-size="13" font-weight="500" fill="#edeef3" text-anchor="start">1. Train on everything before the held-back window.</text><text x="40" y="84" font-size="13" font-weight="500" fill="#edeef3" text-anchor="start">2. Predict the held-back window and compare with what really happened. Accuracy = 100 − sMAPE.</text><text x="40" y="228" font-size="13" font-weight="500" fill="#a3a7b1" text-anchor="start">3. Refit on the whole period. Later forecasts are also scored once their window has passed.</text></svg>