<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><defs><pattern id="d" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="1" fill="#353841" opacity="1"/></pattern><pattern id="h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#eebd53" stroke-width="1.5" opacity=".6"/></pattern></defs><rect width="980" height="300" fill="#17181c"/><rect width="980" height="300" fill="url(#d)"/><rect x="30" y="100" width="230" height="96" rx="9" fill="#23262f" stroke="#3369ff" stroke-width="1.6"/><text x="48" y="130" font-size="15" font-weight="600" fill="#edeef3" text-anchor="start">Build</text><text x="48" y="152" font-size="12.5" font-weight="500" fill="#a3a7b1" text-anchor="start">Fit on the training period,</text><text x="48" y="170" font-size="12.5" font-weight="500" fill="#a3a7b1" text-anchor="start">measure accuracy, forecast</text><rect x="375" y="100" width="230" height="96" rx="9" fill="#23262f" stroke="#3369ff" stroke-width="1.6"/><text x="393" y="130" font-size="15" font-weight="600" fill="#edeef3" text-anchor="start">Refresh</text><text x="393" y="152" font-size="12.5" font-weight="500" fill="#a3a7b1" text-anchor="start">Read new data, predict again</text><text x="393" y="170" font-size="12.5" font-weight="500" fill="#a3a7b1" text-anchor="start">from the newest reading</text><rect x="720" y="100" width="230" height="96" rx="9" fill="#23262f" stroke="#3fd9d1" stroke-width="1.6"/><text x="738" y="130" font-size="15" font-weight="600" fill="#edeef3" text-anchor="start">Retrain</text><text x="738" y="152" font-size="12.5" font-weight="500" fill="#a3a7b1" text-anchor="start">Fit again on the whole</text><text x="738" y="170" font-size="12.5" font-weight="500" fill="#a3a7b1" text-anchor="start">training period</text><polyline points="260,148 375,148" fill="none" stroke="#3369ff" stroke-width="1.8" stroke-linejoin="round"/><polyline points="368.0,151.8 375,148 368.0,144.2" fill="none" stroke="#3369ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="318" y="138" font-size="12" font-weight="500" fill="#a3a7b1" text-anchor="middle" font-style="italic">once</text><polyline points="460,100 460,62 520,62 520,100" fill="none" stroke="#3369ff" stroke-width="1.8" stroke-linejoin="round"/><polyline points="516.2,93.0 520,100 523.8,93.0" fill="none" stroke="#3369ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="490" y="50" font-size="12" font-weight="500" fill="#a3a7b1" text-anchor="middle" font-style="italic">every period</text><polyline points="605,130 720,130" fill="none" stroke="#3fd9d1" stroke-width="1.8" stroke-linejoin="round"/><polyline points="713.0,133.8 720,130 713.0,126.2" fill="none" stroke="#3fd9d1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polyline points="720,166 605,166" fill="none" stroke="#3fd9d1" stroke-width="1.8" stroke-linejoin="round"/><polyline points="612.0,162.2 605,166 612.0,169.8" fill="none" stroke="#3fd9d1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="662" y="120" font-size="12" font-weight="500" fill="#a3a7b1" text-anchor="middle" font-style="italic">when needed</text><text x="662" y="186" font-size="12" font-weight="500" fill="#a3a7b1" text-anchor="middle" font-style="italic">then refresh</text><rect x="375" y="222" width="230" height="50" rx="9" fill="#1b1f2e" stroke="#3369ff" stroke-width="1.2" stroke-dasharray="5 4"/><text x="490" y="243" font-size="12" font-weight="500" fill="#a3a7b1" text-anchor="middle">With Scheduled retrain on,</text><text x="490" y="260" font-size="12" font-weight="500" fill="#a3a7b1" text-anchor="middle">the refresh also learns first</text><polyline points="490,196 490,222" fill="none" stroke="#3369ff" stroke-width="1.4" stroke-linejoin="round"/><polyline points="486.2,215.0 490,222 493.8,215.0" fill="none" stroke="#3369ff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>